services:
  app:
    image: php:8.4-fpm
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portal_laravel_app
    working_dir: /var/www/html
    volumes:
      - ./PortalMobileApp:/var/www/html
      - ./php.ini:/usr/local/etc/php/php.ini
    networks:
      - laravel

  webserver:
    image: nginx:latest
    container_name: portal_laravel_webserver
    ports:
      - "8000:80"
    volumes:
      - ./PortalMobileApp:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel

  mysql:
    image: mysql:8
    container_name: portal_laravel_db
    ports:
      - "3309:3306"
    environment:
      MYSQL_DATABASE: portal_laravel_db
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
      MYSQL_ROOT_PASSWORD: root
    networks:
      - laravel

networks:
  laravel:
    driver: bridge
